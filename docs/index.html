<meta name="claude:viewport-fit-sides" content="cover">

<style>

:root{
  --bg:#f6f8f6; --surface:#ffffff; --fg:#1d2a24; --muted:#5d6b64; --line:#d8e0db;
  --accent:#2f6b4f; --accent-soft:#e3efe8;
  --lvA:#2f6b4f; --lvB:#8a6d1e; --lvC:#a2483a;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a17; --surface:#1a2420; --fg:#e4ece7; --muted:#9aaba2; --line:#2c3a34;
  --accent:#7cc4a0; --accent-soft:#21362c; --lvA:#7cc4a0; --lvB:#d9b75e; --lvC:#e78b7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a17; --surface:#1a2420; --fg:#e4ece7; --muted:#9aaba2; --line:#2c3a34;
  --accent:#7cc4a0; --accent-soft:#21362c; --lvA:#7cc4a0; --lvB:#d9b75e; --lvC:#e78b7b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
header{padding-block:28px 12px;display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-size:clamp(24px,4vw,32px);margin:0;text-wrap:balance;line-height:1.3}
.lede{color:var(--muted);margin:0;max-width:68ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.tabs button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{display:grid;gap:8px}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;justify-self:start}
.modes button{font:inherit;font-weight:600;font-size:13px;border:0;background:var(--surface);color:var(--muted);padding:6px 16px;cursor:pointer}
.modes button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.modes button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.subj{margin-top:26px;display:grid;gap:12px}
.subj h2{border-bottom:1px solid var(--line);padding-bottom:6px}
.sems{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:12px}
.sem{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px;min-width:0}
.sem h3{margin:0 0 8px;font-size:13px;color:var(--accent);letter-spacing:.04em}
.sem ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sem li{display:grid;gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.std{line-height:1.55}
.std b{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;margin-right:2px}
.chip.unit{color:var(--fg)}
.chip.k{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.sem li{padding-bottom:8px;border-bottom:1px dashed var(--line)}
.sem li:last-child{border-bottom:0;padding-bottom:0}
.chip{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);background:var(--bg)}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details .table{border:0;border-top:1px solid var(--line);border-radius:0 0 8px 8px}
.levels{display:flex;flex-wrap:wrap;gap:8px 18px;padding-block:14px;font-size:13px;color:var(--muted)}
.levels b{font-weight:600}
.pill{display:inline-block;min-width:22px;text-align:center;font-weight:600;font-size:12px;border-radius:4px;padding:0 6px;margin-right:4px;color:var(--surface)}
.pA{background:var(--lvA)}.pB{background:var(--lvB)}.pC{background:var(--lvC)}
section.band{margin-top:22px}
h2{font-family:var(--display);font-size:20px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.table{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:160px repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>div{padding:12px 14px;min-width:0}
.row.head{background:var(--accent-soft);font-size:13px;font-weight:600}
.area{font-weight:600}
.code{display:block;font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.lv{display:none}
.note{margin-top:22px;font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;max-width:80ch}
@media (max-width:720px){
  .row.head{display:none}
  .row{grid-template-columns:1fr}
  .row>div{padding:8px 14px}
  .row>div.area{padding-top:14px;background:var(--accent-soft)}
  .lv{display:inline-block}
}
</style>

const D = {"general": {"A": "개념·원리를 정확히 이해하고, 새로운 상황에 전이·적용하며, 관련 기능을 능숙하게 수행한다.", "B": "개념·원리를 대체로 이해하고, 익숙한 상황에 적용하며, 관련 기능을 무리 없이 수행한다.", "C": "개념·원리를 부분적으로 이해하고, 교사의 안내나 도움을 받아 기본적인 기능을 수행한다."}, "note": "1~2학년은 국어·수학 외 사회·과학·도덕·음악·미술·체육이 통합교과(바른 생활·슬기로운 생활·즐거운 생활)로 운영되어 별도 성취수준이 없습니다. 실과는 5~6학년, 도덕은 3~6학년에만 편성됩니다.", "grades": [{"grade": 1, "band": "1~2학년", "subjects": [{"name": "국어", "areas": ["문법", "읽기", "쓰기", "듣기·말하기", "문학", "매체"], "stds": [{"code": "[2국01-05]", "text": "듣기와 말하기에 관심과 흥미를 가진다.", "sems": ["1학기"], "units": ["5. 반갑게 인사해요"], "kind": "두 학년 공통"}, {"code": "[2국02-01]", "text": "글자, 단어, 문장, 짧은 글을 정확하게 소리 내어 읽는다.", "sems": ["1학기", "2학기"], "units": ["1학기 6. 또박또박 읽어요", "2학기 2. 낱말을 정확하게 읽어요"], "kind": "단일 학년"}, {"code": "[2국02-05]", "text": "읽기에 흥미를 가지고 즐겨 읽는 태도를 지닌다.", "sems": ["1학기"], "units": ["6. 또박또박 읽어요"], "kind": "두 학년 공통"}, {"code": "[2국03-01]", "text": "글자와 단어를 바르게 쓴다.", "sems": ["1학기"], "units": ["1. 글자를 만들어요"], "kind": "단일 학년"}, {"code": "[2국04-01]", "text": "한글 자모의 이름과 소릿값을 알고 정확하게 발음하고 쓴다.", "sems": ["1학기"], "units": ["한글 놀이", "1. 글자를 만들어요"], "kind": "단일 학년"}, {"code": "[2국04-02]", "text": "소리와 표기가 다를 수 있음을 알고 단어를 바르게 읽고 쓴다.", "sems": ["1학기", "2학기"], "units": ["1학기 2. 받침이 있는 글자를 읽어요", "2학기 6. 문장을 읽고 써요"], "kind": "단일 학년"}, {"code": "[2국04-03]", "text": "문장과 문장 부호를 알맞게 쓰고 한글에 호기심을 가진다.", "sems": ["1학기"], "units": ["6. 또박또박 읽어요"], "kind": "단일 학년"}, {"code": "[2국05-04]", "text": "시나 노래, 이야기에 흥미를 가진다.", "sems": ["2학기"], "units": ["4. 감동을 나누어요"], "kind": "두 학년 공통"}]}, {"name": "수학", "areas": ["수와 연산", "도형과 측정", "변화와 관계"], "stds": [{"code": "[2수01-01]", "text": "수의 필요성을 인식하면서 0과 100까지의 수 개념을 이해하고, 수를 세고 읽고 쓸 수 있다.", "sems": ["1학기", "2학기"], "units": ["1학기 1. 9까지의 수", "1학기 5. 50까지의 수", "2학기 1. 100까지의 수"], "kind": "단일 학년"}, {"code": "[2수01-04]", "text": "하나의 수를 두 수로 분해하고 두 수를 하나의 수로 합성하는 활동을 통하여 수 감각을 기른다.", "sems": ["1학기"], "units": ["3. 덧셈과 뺄셈"], "kind": "단일 학년"}, {"code": "[2수01-05]", "text": "덧셈과 뺄셈이 이루어지는 실생활 상황과 연결하여 덧셈과 뺄셈의 의미를 이해한다.", "sems": ["1학기"], "units": ["3. 덧셈과 뺄셈"], "kind": "단일 학년"}, {"code": "[2수01-07]", "text": "덧셈과 뺄셈의 관계를 이해한다.", "sems": ["1학기"], "units": ["3. 덧셈과 뺄셈"], "kind": "두 학년 공통"}, {"code": "[2수03-01]", "text": "교실 및 생활 주변에서 여러 가지 물건을 관찰하여 직육면체, 원기둥, 구의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다.", "sems": ["1학기"], "units": ["2. 여러 가지 모양"], "kind": "단일 학년"}, {"code": "[2수03-03]", "text": "교실 및 생활 주변에서 여러 가지 물건을 관찰하여 삼각형, 사각형, 원의 모양을 찾고, 이를 이용하여 여러 가지 모양을 만들 수 있다.", "sems": ["1학기"], "units": ["2. 여러 가지 모양"], "kind": "단일 학년"}, {"code": "[2수03-06]", "text": "구체물의 길이, 들이, 무게, 넓이를 비교하여 각각 ‘길다, 짧다’, ‘많다, 적다’, ‘무겁다, 가볍다’, ‘넓다, 좁다’ 등을 구별하여 말할 수 있다.", "sems": ["1학기"], "units": ["4. 비교하기"], "kind": "단일 학년"}, {"code": "[2수01-06]", "text": "두 자리 수의 범위에서 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.", "sems": ["2학기"], "units": ["2. 덧셈과 뺄셈(1)"], "kind": "두 학년 공통"}, {"code": "[2수01-08]", "text": "두 자리 수의 범위에서 세 수의 덧셈과 뺄셈을 할 수 있다.", "sems": ["2학기"], "units": ["6. 덧셈과 뺄셈(3)"], "kind": "두 학년 공통"}, {"code": "[2수02-01]", "text": "물체, 무늬, 수 등의 배열에서 규칙을 찾아 여러 가지 방법으로 표현할 수 있다.", "sems": ["2학기"], "units": ["5. 규칙 찾기"], "kind": "단일 학년"}, {"code": "[2수02-02]", "text": "자신이 정한 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다.", "sems": ["2학기"], "units": ["5. 규칙 찾기"], "kind": "두 학년 공통"}, {"code": "[2수03-04]", "text": "삼각형, 사각형, 원을 직관적으로 이해하고, 그 모양을 그릴 수 있다.", "sems": ["2학기"], "units": ["3. 모양과 시각"], "kind": "두 학년 공통"}, {"code": "[2수03-07]", "text": "시계를 보고 시각을 ‘몇 시 몇 분’까지 읽을 수 있다.", "sems": ["2학기"], "units": ["3. 모양과 시각"], "kind": "두 학년 공통"}]}]}, {"grade": 2, "band": "1~2학년", "subjects": [{"name": "국어", "areas": ["듣기·말하기", "문학", "문법", "쓰기", "읽기", "매체"], "stds": [{"code": "[2국01-03]", "text": "상대의 말을 집중하여 듣고 말차례를 지키며 대화한다.", "sems": ["1학기"], "units": ["1. 만나서 반가워요!"], "kind": "단일 학년"}, {"code": "[2국01-04]", "text": "자신의 경험이나 생각을 바른 자세로 발표한다.", "sems": ["1학기"], "units": ["6. 자신의 생각을 표현해요"], "kind": "단일 학년"}, {"code": "[2국01-05]", "text": "듣기와 말하기에 관심과 흥미를 가진다.", "sems": ["1학기"], "units": ["1. 만나서 반가워요!"], "kind": "두 학년 공통"}, {"code": "[2국02-02]", "text": "의미가 잘 드러나도록 문장과 짧은 글을 알맞게 띄어 읽는다.", "sems": ["1학기"], "units": ["5. 마음을 짐작해요"], "kind": "단일 학년"}, {"code": "[2국02-04]", "text": "인물의 마음이나 생각을 짐작하고 이를 자신과 비교하며 글을 읽는다.", "sems": ["1학기"], "units": ["5. 마음을 짐작해요"], "kind": "단일 학년"}, {"code": "[2국02-05]", "text": "읽기에 흥미를 가지고 즐겨 읽는 태도를 지닌다.", "sems": ["1학기"], "units": ["4. 분위기를 살려 읽어요"], "kind": "두 학년 공통"}, {"code": "[2국03-02]", "text": "쓰기에 흥미를 가지며 자신의 생각이나 느낌을 문장으로 표현한다.", "sems": ["1학기"], "units": ["6. 자신의 생각을 표현해요"], "kind": "단일 학년"}, {"code": "[2국03-04]", "text": "겪은 일을 표현하는 글을 자유롭게 쓰고, 쓴 글을 함께 읽고 생각이나 느낌을 나눈다.", "sems": ["1학기"], "units": ["3. 겪은 일을 나타내요"], "kind": "단일 학년"}, {"code": "[2국05-01]", "text": "말놀이, 낭송 등을 통해 말의 재미와 즐거움을 느낀다.", "sems": ["1학기"], "units": ["2. 말의 재미가 솔솔"], "kind": "단일 학년"}, {"code": "[2국05-02]", "text": "작품을 듣거나 읽으면서 느끼거나 생각한 점을 말한다.", "sems": ["1학기"], "units": ["8. 다양한 작품을 감상해요"], "kind": "단일 학년"}, {"code": "[2국01-01]", "text": "중요한 내용이나 일이 일어난 순서를 고려하며 듣고 말한다.", "sems": ["2학기"], "units": ["5. 바른 말로 이야기 나누어요"], "kind": "단일 학년"}, {"code": "[2국01-02]", "text": "바르고 고운 말로 서로의 감정을 나누며 듣고 말한다.", "sems": ["2학기"], "units": ["2. 서로 존중해요"], "kind": "단일 학년"}, {"code": "[2국02-03]", "text": "글을 읽고 중심 내용을 확인한다.", "sems": ["2학기"], "units": ["3. 내용을 살펴요"], "kind": "단일 학년"}, {"code": "[2국03-03]", "text": "주변 소재에 대해 소개하는 글을 쓴다.", "sems": ["2학기"], "units": ["3. 내용을 살펴요 › 사물을 설명하는 글 관련 차시"], "kind": "단일 학년"}, {"code": "[2국05-03]", "text": "작품 속 인물의 모습, 행동, 마음을 상상하여 시, 노래, 이야기, 그림 등으로 표현한다.", "sems": ["2학기"], "units": ["1. 장면을 상상하며"], "kind": "단일 학년"}, {"code": "[2국05-04]", "text": "시나 노래, 이야기에 흥미를 가진다.", "sems": ["2학기"], "units": ["8. 나도 작가"], "kind": "두 학년 공통"}, {"code": "[2국06-01]", "text": "일상의 다양한 매체와 매체 자료에 흥미와 관심을 가진다.", "sems": ["2학기"], "units": ["6. 매체를 경험해요"], "kind": "단일 학년"}, {"code": "[2국06-02]", "text": "일상의 경험과 생각을 글과 그림으로 표현한다.", "sems": ["2학기"], "units": ["6. 매체를 경험해요"], "kind": "단일 학년"}]}, {"name": "수학", "areas": ["수와 연산", "도형과 측정", "자료와 가능성", "변화와 관계"], "stds": [{"code": "[2수01-02]", "text": "일, 십, 백, 천의 자릿값과 위치적 기수법을 이해하고, 네 자리 이하의 수를 읽고 쓸 수 있다.", "sems": ["1학기", "2학기"], "units": ["1학기 1. 세 자리 수", "2학기 1. 네 자리 수"], "kind": "단일 학년"}, {"code": "[2수01-06]", "text": "두 자리 수의 범위에서 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.", "sems": ["1학기"], "units": ["3. 덧셈과 뺄셈"], "kind": "두 학년 공통"}, {"code": "[2수01-07]", "text": "덧셈과 뺄셈의 관계를 이해한다.", "sems": ["1학기"], "units": ["3. 덧셈과 뺄셈"], "kind": "두 학년 공통"}, {"code": "[2수01-08]", "text": "두 자리 수의 범위에서 세 수의 덧셈과 뺄셈을 할 수 있다.", "sems": ["1학기"], "units": ["3. 덧셈과 뺄셈"], "kind": "두 학년 공통"}, {"code": "[2수01-09]", "text": "□가 사용된 덧셈식과 뺄셈식을 만들고, □의 값을 구할 수 있다.", "sems": ["1학기"], "units": ["3. 덧셈과 뺄셈"], "kind": "단일 학년"}, {"code": "[2수01-10]", "text": "곱셈이 이루어지는 실생활 상황과 연결하여 곱셈의 의미를 이해한다.", "sems": ["1학기"], "units": ["6. 곱셈"], "kind": "단일 학년"}, {"code": "[2수03-02]", "text": "쌓기나무를 이용하여 여러 가지 입체도형의 모양을 만들고, 그 모양에 대해 위치나 방향을 이용하여 말할 수 있다.", "sems": ["1학기"], "units": ["2. 여러 가지 도형"], "kind": "단일 학년"}, {"code": "[2수03-04]", "text": "삼각형, 사각형, 원을 직관적으로 이해하고, 그 모양을 그릴 수 있다.", "sems": ["1학기"], "units": ["2. 여러 가지 도형"], "kind": "두 학년 공통"}, {"code": "[2수03-05]", "text": "삼각형, 사각형에서 각각의 공통점을 찾아 말할 수 있다.", "sems": ["1학기"], "units": ["2. 여러 가지 도형"], "kind": "단일 학년"}, {"code": "[2수03-10]", "text": "길이 단위 1cm와 1m를 알고, 이를 이용하여 주변 사물의 길이를 측정할 수 있다.", "sems": ["1학기"], "units": ["4. 길이 재기"], "kind": "단일 학년"}, {"code": "[2수03-12]", "text": "여러 가지 물건의 길이를 어림하고, 길이에 대한 양감을 기른다.", "sems": ["1학기", "2학기"], "units": ["1학기 4. 길이 재기", "2학기 3. 길이 재기"], "kind": "단일 학년"}, {"code": "[2수04-01]", "text": "여러 가지 사물을 정해진 기준 또는 자신이 정한 기준으로 분류하여 개수를 세어 보고, 기준에 따른 결과를 말할 수 있다.", "sems": ["1학기"], "units": ["5. 분류하기"], "kind": "단일 학년"}, {"code": "[2수01-03]", "text": "네 자리 이하의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교할 수 있다.", "sems": ["2학기"], "units": ["1. 네 자리 수"], "kind": "단일 학년"}, {"code": "[2수01-11]", "text": "곱셈구구를 이해하고, 한 자리 수의 곱셈을 할 수 있다.", "sems": ["2학기"], "units": ["2. 곱셈구구"], "kind": "단일 학년"}, {"code": "[2수02-02]", "text": "자신이 정한 규칙에 따라 물체, 무늬, 수 등을 배열할 수 있다.", "sems": ["2학기"], "units": ["6. 규칙 찾기"], "kind": "두 학년 공통"}, {"code": "[2수03-07]", "text": "시계를 보고 시각을 ‘몇 시 몇 분’까지 읽을 수 있다.", "sems": ["2학기"], "units": ["4. 시각과 시간"], "kind": "두 학년 공통"}, {"code": "[2수03-08]", "text": "1시간과 1분의 관계를 이해하고, 시간을 ‘시간’, ‘분’으로 표현할 수 있다.", "sems": ["2학기"], "units": ["4. 시각과 시간"], "kind": "단일 학년"}, {"code": "[2수03-09]", "text": "실생활 문제 상황과 연결하여 1분, 1시간, 1일, 1주일, 1개월, 1년 사이의 관계를 이해한다.", "sems": ["2학기"], "units": ["4. 시각과 시간"], "kind": "단일 학년"}, {"code": "[2수03-11]", "text": "1m와 1cm의 관계를 이해하고, 길이를 ‘몇 m 몇 cm’와 ‘몇 cm’로 표현할 수 있다.", "sems": ["2학기"], "units": ["3. 길이 재기"], "kind": "단일 학년"}, {"code": "[2수03-13]", "text": "실생활 문제 상황과 연결하여 길이의 덧셈과 뺄셈을 할 수 있다.", "sems": ["2학기"], "units": ["3. 길이 재기"], "kind": "단일 학년"}, {"code": "[2수04-02]", "text": "자료를 분류하여 표로 나타내고, 자료를 표로 나타내면 편리한 점을 말할 수 있다.", "sems": ["2학기"], "units": ["5. 표와 그래프"], "kind": "단일 학년"}, {"code": "[2수04-03]", "text": "자료를 분류하여 ○, ×, / 등을 이용한 그래프로 나타내고, 자료를 그래프로 나타내면 편리한 점을 말할 수 있다.", "sems": ["2학기"], "units": ["5. 표와 그래프"], "kind": "단일 학년"}]}]}, {"grade": 3, "band": "3~4학년", "subjects": [{"name": "국어", "areas": ["읽기", "문학", "쓰기", "듣기·말하기", "문법"], "stds": [{"code": "[4국01-01]", "text": "중요한 내용과 주제를 파악하며 듣고 그 내용을 요약한다.", "sems": ["1학기"], "units": ["4. 중요한 내용을 찾아요 › 1. 중요한 내용을 파악하며 듣기"], "kind": "단일 학년"}, {"code": "[4국02-04]", "text": "글에 나타난 사실과 의견을 구분하고 필자와 자신의 의견을 비교한다.", "sems": ["1학기"], "units": ["6. 자신 있게 읽고 써요 › 1. 사실과 의견 구분하기"], "kind": "단일 학년"}, {"code": "[4국02-06]", "text": "바람직한 읽기 습관을 형성하고 읽기에 대한 자신감을 기른다.", "sems": ["1학기", "2학기"], "units": ["1학기 독서: 읽은 책을 소개해요", "2학기 독서: 계획대로 차근차근 읽어요"], "kind": "두 학년 공통"}, {"code": "[4국03-01]", "text": "중심 문장과 뒷받침 문장을 갖추어 문단을 쓰고, 문장과 문단을 중심으로 고쳐 쓴다.", "sems": ["1학기"], "units": ["3. 짜임새 있는 글, 재미와 감동이 있는 글 › 1. 짜임새 있는 문단 쓰기"], "kind": "단일 학년"}, {"code": "[4국03-04]", "text": "목적과 주제를 고려하여 독자에게 마음을 전하는 글을 쓴다.", "sems": ["1학기"], "units": ["5. 인물에게 마음을 전해요 › 2. 마음을 전하는 글 쓰기"], "kind": "단일 학년"}, {"code": "[4국03-05]", "text": "자신의 쓰기 과정을 점검하며 쓰기에 자신감을 갖는다.", "sems": ["1학기"], "units": ["6. 자신 있게 읽고 써요"], "kind": "단일 학년"}, {"code": "[4국04-03]", "text": "기본적인 문장의 짜임을 이해하고 적절하게 사용한다.", "sems": ["1학기"], "units": ["2. 분명하고 유창하게"], "kind": "단일 학년"}, {"code": "[4국05-03]", "text": "작품을 듣거나 읽고 마음에 드는 작품을 소개한다.", "sems": ["1학기"], "units": ["3. 짜임새 있는 글, 재미와 감동이 있는 글 › 2. 작품을 읽고 재미나 감동 표현하기"], "kind": "두 학년 공통"}, {"code": "[4국05-05]", "text": "재미나 감동을 느끼며 작품을 즐겨 감상하는 태도를 지닌다.", "sems": ["1학기"], "units": ["3. 짜임새 있는 글, 재미와 감동이 있는 글 › 2. 작품을 읽고 재미나 감동 표현하기"], "kind": "단일 학년"}, {"code": "[4국01-03]", "text": "상황에 적절한 준언어⋅비언어적 표현을 활용하여 듣고 말한다.", "sems": ["2학기"], "units": ["4. 서로 존중하며 대화해요 › 1. 높임 표현을 바르게 사용하기"], "kind": "단일 학년"}, {"code": "[4국01-04]", "text": "상황과 상대의 입장을 이해하고 예의를 지키며 대화한다.", "sems": ["2학기"], "units": ["4. 서로 존중하며 대화해요"], "kind": "단일 학년"}, {"code": "[4국01-06]", "text": "주제에 적절한 의견과 이유를 제시하고 서로의 생각을 교환하며 토의한다.", "sems": ["2학기"], "units": ["6. 감상과 표현의 즐거움 › 2. 의견을 제시하는 글 쓰기"], "kind": "두 학년 공통"}, {"code": "[4국02-01]", "text": "글의 의미를 파악하며 유창하게 글을 읽는다.", "sems": ["2학기"], "units": ["2. 유창하게 읽고 발표해요 › 1. 글을 유창하게 소리 내어 읽기"], "kind": "단일 학년"}, {"code": "[4국02-05]", "text": "글이나 자료의 출처가 믿을 만한지 판단한다.", "sems": ["2학기"], "units": ["3. 정확하게 글을 써요 › 1. 출처를 확인하며 글 읽기"], "kind": "단일 학년"}, {"code": "[4국04-02]", "text": "단어를 분류하고 국어사전을 활용하여 능동적인 국어 활동을 한다.", "sems": ["2학기"], "units": ["5. 사전으로 여는 세상 › 2. 국어사전 활용하기"], "kind": "단일 학년"}, {"code": "[4국04-04]", "text": "글과 담화에 쓰인 높임 표현과 지시⋅접속 표현을 이해하고 상황에 맞게 표현한다.", "sems": ["2학기"], "units": ["4. 서로 존중하며 대화해요 › 1. 높임 표현을 바르게 사용하기"], "kind": "단일 학년"}, {"code": "[4국06-02]", "text": "매체를 활용하여 간단한 발표 자료를 만든다.", "sems": ["2학기"], "units": ["2. 유창하게 읽고 발표해요 › 2. 글과 그림을 활용하여 표현하기"], "kind": "두 학년 공통"}]}, {"name": "수학", "areas": ["수와 연산", "도형과 측정", "자료와 가능성"], "stds": [{"code": "[4수01-03]", "text": "세 자리 수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.", "sems": ["1학기"], "units": ["1. 덧셈과 뺄셈"], "kind": "단일 학년"}, {"code": "[4수01-04]", "text": "곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈의 계산 원리를 이해하고 그 계산을 할 수 있다.", "sems": ["1학기", "2학기"], "units": ["1학기 4. 곱셈", "2학기 1. 곱셈"], "kind": "두 학년 공통"}, {"code": "[4수01-05]", "text": "나눗셈이 이루어지는 실생활 상황과 연결하여 나눗셈의 의미를 알고, 곱셈과 나눗셈의 관계를 이해한다.", "sems": ["1학기"], "units": ["3. 나눗셈"], "kind": "단일 학년"}, {"code": "[4수01-08]", "text": "자연수의 덧셈, 뺄셈, 곱셈, 나눗셈과 관련한 여러 가지 상황에서 어림셈을 할 수 있다.", "sems": ["1학기"], "units": ["1. 덧셈과 뺄셈"], "kind": "두 학년 공통"}, {"code": "[4수01-09]", "text": "양의 등분할을 통하여 분수의 필요성을 인식하고, 분수를 이해하고 읽고 쓸 수 있다.", "sems": ["1학기"], "units": ["6. 분수와 소수"], "kind": "단일 학년"}, {"code": "[4수01-11]", "text": "분모가 같은 분수끼리, 단위분수끼리 크기를 비교하고 그 방법을 설명할 수 있다.", "sems": ["1학기", "2학기"], "units": ["1학기 6. 분수와 소수", "2학기 4. 분수"], "kind": "단일 학년"}, {"code": "[4수01-12]", "text": "분모가 10인 진분수와 연결하여 소수 한 자리 수를 이해하고 읽고 쓸 수 있다.", "sems": ["1학기"], "units": ["6. 분수와 소수"], "kind": "단일 학년"}, {"code": "[4수03-01]", "text": "직선, 선분, 반직선을 이해하고 구별할 수 있다.", "sems": ["1학기"], "units": ["2. 평면도형"], "kind": "단일 학년"}, {"code": "[4수03-02]", "text": "각과 직각을 이해하고, 직각과 비교하는 활동을 통하여 예각과 둔각을 구별할 수 있다.", "sems": ["1학기"], "units": ["2. 평면도형"], "kind": "두 학년 공통"}, {"code": "[4수03-13]", "text": "1분과 1초의 관계를 이해하고, 초 단위까지 시각을 읽을 수 있다.", "sems": ["1학기"], "units": ["5. 길이와 시간"], "kind": "단일 학년"}, {"code": "[4수03-14]", "text": "실생활 문제 상황과 연결하여 초 단위까지의 시간의 덧셈과 뺄셈을 할 수 있다.", "sems": ["1학기"], "units": ["5. 길이와 시간"], "kind": "단일 학년"}, {"code": "[4수03-15]", "text": "길이 단위 1mm와 1km를 알고, 이를 이용하여 길이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다.", "sems": ["1학기"], "units": ["5. 길이와 시간"], "kind": "단일 학년"}, {"code": "[4수03-16]", "text": "1cm와 1mm, 1km와 1m의 관계를 이해하고, 길이를 ‘몇 cm 몇 mm’와 ‘몇 mm’, ‘몇 km 몇 m’와 ‘몇 m’로 다양하게 표현할 수 있다.", "sems": ["1학기"], "units": ["5. 길이와 시간"], "kind": "단일 학년"}, {"code": "[4수01-06]", "text": "나누는 수가 한 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있으며, 나눗셈에서 몫과 나머지의 의미를 안다.", "sems": ["2학기"], "units": ["2. 나눗셈"], "kind": "단일 학년"}, {"code": "[4수01-10]", "text": "단위분수, 진분수, 가분수, 대분수를 알고, 그 관계를 이해한다.", "sems": ["2학기"], "units": ["4. 분수"], "kind": "단일 학년"}, {"code": "[4수03-06]", "text": "원의 중심, 반지름, 지름을 이해하고, 그 성질을 안다.", "sems": ["2학기"], "units": ["3. 원"], "kind": "단일 학년"}, {"code": "[4수03-07]", "text": "컴퍼스를 이용하여 여러 가지 크기의 원을 그릴 수 있다.", "sems": ["2학기"], "units": ["3. 원"], "kind": "단일 학년"}, {"code": "[4수03-17]", "text": "들이 단위 1L와 1mL를 알고, 이를 이용하여 들이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다.", "sems": ["2학기"], "units": ["5. 들이와 무게"], "kind": "단일 학년"}, {"code": "[4수03-18]", "text": "1L와 1mL의 관계를 이해하고, 들이를 ‘몇 L 몇 mL’와 ‘몇 mL’로 표현할 수 있다.", "sems": ["2학기"], "units": ["5. 들이와 무게"], "kind": "단일 학년"}, {"code": "[4수03-19]", "text": "실생활 문제 상황과 연결하여 들이의 덧셈과 뺄셈을 할 수 있다.", "sems": ["2학기"], "units": ["5. 들이와 무게"], "kind": "단일 학년"}, {"code": "[4수03-20]", "text": "실생활에서 무게를 나타낼 때 사용하는 단위 1g과 1kg을 알고, 이를 이용하여 무게를 측정하고 어림하며 수학의 유용성을 인식할 수 있다.", "sems": ["2학기"], "units": ["5. 들이와 무게"], "kind": "단일 학년"}, {"code": "[4수03-21]", "text": "1kg과 1g의 관계를 이해하고, 무게를 ‘몇 kg 몇 g’과 ‘몇 g’으로 표현할 수 있다.", "sems": ["2학기"], "units": ["5. 들이와 무게"], "kind": "단일 학년"}, {"code": "[4수03-22]", "text": "실생활에서 무게를 나타낼 때 사용하는 단위 1t을 알고, 1t과 1kg의 관계를 이해한다.", "sems": ["2학기"], "units": ["5. 들이와 무게"], "kind": "단일 학년"}, {"code": "[4수03-23]", "text": "실생활 문제 상황과 연결하여 무게의 덧셈과 뺄셈을 할 수 있다.", "sems": ["2학기"], "units": ["5. 들이와 무게"], "kind": "단일 학년"}, {"code": "[4수04-01]", "text": "자료를 수집하여 그림그래프나 막대그래프로 나타내고 해석할 수 있다.", "sems": ["2학기"], "units": ["6. 그림그래프"], "kind": "두 학년 공통"}]}, {"name": "사회", "areas": ["지리 인식", "인문환경과 인간 생활", "역사 일반·지역사", "사회·문화"], "stds": [{"code": "[4사01-01]", "text": "주변 여러 장소에서의 경험과 느낌을 다양한 방식으로 표현하고, 장소감을 나누며 서로 존중하는 태도를 지닌다.", "sems": ["1학기"], "units": ["우리가 사는 곳 (여러 장소, 생활에 도움을 주는 장소)"], "kind": "단일 학년"}, {"code": "[4사01-02]", "text": "주변의 여러 장소를 살펴보고, 우리가 사는 곳을 더 살기 좋은 곳으로 만드는 방안을 탐색한다.", "sems": ["1학기"], "units": ["우리가 사는 곳 (여러 장소, 생활에 도움을 주는 장소)"], "kind": "단일 학년"}, {"code": "[4사02-01]", "text": "일상 속에서 시간의 흐름을 경험할 수 있는 사례를 살펴보고, 이를 바탕으로 역사의 시간 개념을 이해한다.", "sems": ["1학기"], "units": ["일상에서 만나는 과거 (시간의 흐름, 과거의 모습, 달라진 생활 모습)"], "kind": "단일 학년"}, {"code": "[4사02-02]", "text": "오래된 물건이나 자료들을 주변에서 찾아보고, 이를 통해 과거의 모습을 살펴볼 수 있음을 이해한다.", "sems": ["1학기"], "units": ["일상에서 만나는 과거 (시간의 흐름, 과거의 모습, 달라진 생활 모습)"], "kind": "단일 학년"}, {"code": "[4사02-03]", "text": "지역의 변화상을 보여주는 역사 자료를 분석하여 지역 사람들의 달라진 생활 모습을 파악한다.", "sems": ["1학기"], "units": ["일상에서 만나는 과거 (시간의 흐름, 과거의 모습, 달라진 생활 모습) › 우리 지역 사람들 관련 차시"], "kind": "단일 학년"}, {"code": "[4사03-01]", "text": "최근 사회 변화의 양상과 특징을 파악하고, 그로 인해 나타난 생활모습의 변화를 탐색한다.", "sems": ["2학기"], "units": ["사회 변화로 달라진 생활 모습 (교통·통신의 변화)"], "kind": "단일 학년"}, {"code": "[4사03-02]", "text": "우리 사회에 다양한 문화가 확산되면서 나타나는 긍정적 효과와 문제를 분석하고, 나와 다른 사람이나 집단의 문화를 존중하는 태도를 기른다.", "sems": ["2학기"], "units": ["사회 변화로 달라진 생활 모습 (교통·통신의 변화) › 다양한 문화에 대한 관련 차시"], "kind": "단일 학년"}, {"code": "[4사04-01]", "text": "옛날 풍습에 대해 알아보고, 오늘날과 비교하여 변화상을 파악한다.", "sems": ["2학기"], "units": ["옛날과 오늘날의 풍습·생활 모습"], "kind": "단일 학년"}, {"code": "[4사04-02]", "text": "옛날부터 오늘날까지 교통의 변화에 따른 이동과 생활 모습의 변화를 이해한다.", "sems": ["2학기"], "units": ["사회 변화로 달라진 생활 모습 (교통·통신의 변화) › 교통의 변화 관련 차시"], "kind": "단일 학년"}, {"code": "[4사04-03]", "text": "옛날부터 오늘날까지 통신수단의 변화에 따른 정보 교류와 의사소통 방식의 변화를 설명한다.", "sems": ["2학기"], "units": ["사회 변화로 달라진 생활 모습 (교통·통신의 변화) › 통신수단 관련 차시"], "kind": "단일 학년"}]}, {"name": "과학", "areas": ["운동과 에너지", "생명", "물질", "지구와 우주", "과학과 사회"], "stds": [{"code": "[4과01-01]", "text": "일상생활에서 힘과 관련된 현상에 흥미를 갖고, 물체를 밀거나 당길 때 나타나는 현상을 관찰할 수 있다.", "sems": ["1학기"], "units": ["1. 힘과 우리 생활"], "kind": "단일 학년"}, {"code": "[4과01-02]", "text": "수평잡기 활동을 통해 물체의 무게를 비교할 수 있다.", "sems": ["1학기"], "units": ["1. 힘과 우리 생활"], "kind": "단일 학년"}, {"code": "[4과01-03]", "text": "무게를 정확히 비교하기 위해서는 저울이 필요함을 알고, 저울을 사용해 무게를 비교할 수 있다.", "sems": ["1학기"], "units": ["1. 힘과 우리 생활"], "kind": "단일 학년"}, {"code": "[4과01-04]", "text": "지레, 빗면과 같은 도구를 이용하면 물체를 들어 올릴 때 드는 힘의 크기가 달라짐을 알고, 도구가 일상생활에서 어떻게 쓰이는지 조사하여 공유할 수 있다.", "sems": ["1학기"], "units": ["1. 힘과 우리 생활"], "kind": "단일 학년"}, {"code": "[4과02-01]", "text": "여러 가지 동물을 관찰하여 특징에 따라 동물을 분류할 수 있다.", "sems": ["1학기"], "units": ["2. 동물의 생활"], "kind": "단일 학년"}, {"code": "[4과02-02]", "text": "다양한 환경에 서식하는 동물을 조사하여 동물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.", "sems": ["1학기"], "units": ["2. 동물의 생활"], "kind": "단일 학년"}, {"code": "[4과02-03]", "text": "동물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다.", "sems": ["1학기"], "units": ["2. 동물의 생활"], "kind": "단일 학년"}, {"code": "[4과03-01]", "text": "여러 가지 식물을 관찰하여 특징에 따라 식물을 분류할 수 있다.", "sems": ["1학기"], "units": ["3. 식물의 생활"], "kind": "단일 학년"}, {"code": "[4과03-02]", "text": "다양한 환경에 서식하는 식물을 조사하여 식물의 생김새와 생활 방식이 환경과 관련되어 있음을 설명할 수 있다.", "sems": ["1학기"], "units": ["3. 식물의 생활"], "kind": "단일 학년"}, {"code": "[4과03-03]", "text": "식물의 특징을 이용하여 일상생활에서 활용할 수 있는 생활용품을 설계하여 협력적으로 소통할 수 있다.", "sems": ["1학기"], "units": ["3. 식물의 생활"], "kind": "단일 학년"}, {"code": "[4과04-01]", "text": "동물의 한살이를 직접 관찰하고, 관찰한 내용을 글과 그림으로 표현할 수 있다.", "sems": ["1학기"], "units": ["4. 생물의 한살이"], "kind": "단일 학년"}, {"code": "[4과04-02]", "text": "식물이 자라는 데 필요한 조건을 찾는 실험을 설계하여 수행할 수 있다.", "sems": ["1학기"], "units": ["4. 생물의 한살이"], "kind": "단일 학년"}, {"code": "[4과04-03]", "text": "생물의 한살이 과정을 조사하여 생물에 따라 한살이의 유형이 다양함을 소개하는 자료를 만들어 공유할 수 있다.", "sems": ["1학기"], "units": ["4. 생물의 한살이"], "kind": "단일 학년"}, {"code": "[4과05-01]", "text": "물체를 이루는 여러 가지 물질의 성질을 비교하고, 물질의 종류에 따라 물체를 분류할 수 있다.", "sems": ["2학기"], "units": ["1. 물체와 물질"], "kind": "단일 학년"}, {"code": "[4과05-02]", "text": "물질의 세 가지 상태인 고체, 액체, 기체의 성질을 관찰하여 비교할 수 있다.", "sems": ["2학기"], "units": ["1. 물체와 물질"], "kind": "단일 학년"}, {"code": "[4과05-03]", "text": "다양한 물질의 성질을 이용하여 쓰임새 있는 물체를 설계할 수 있다.", "sems": ["2학기"], "units": ["1. 물체와 물질"], "kind": "단일 학년"}, {"code": "[4과06-01]", "text": "지구가 대기로 둘러싸여 있음을 알고, 지구 표면을 구성하는 육지와 바다의 특징을 비교할 수 있다.", "sems": ["2학기"], "units": ["2. 지구와 바다"], "kind": "단일 학년"}, {"code": "[4과06-02]", "text": "바닷물의 특징을 육지의 물과 비교하고, 바닷가에서 볼 수 있는 다양한 지형을 조사할 수 있다.", "sems": ["2학기"], "units": ["2. 지구와 바다"], "kind": "단일 학년"}, {"code": "[4과06-03]", "text": "밀물과 썰물의 차이를 알고, 갯벌의 가치와 보전의 필요성을 설득⋅홍보할 수 있다.", "sems": ["2학기"], "units": ["2. 지구와 바다"], "kind": "단일 학년"}, {"code": "[4과07-01]", "text": "여러 가지 물체를 이용하여 소리를 내보고, 소리가 나는 물체 its": ["2. 서로 다른 의견"], "kind": "두 학년 공통"}, {"code": "[4국02-02]", "text": "문단과 글에서 중심 생각을 파악하고 내용을 간추린다.", "sems": ["1학기"], "units": ["4. 뜻을 파악하며 읽어요 › 2. 글의 중심 생각을 파악하며 읽기"], "kind": "단일 학년"}, {"code": "[4국02-03]", "text": "질문을 활용하여 글을 예측하며 읽고 자신의 읽기 과정을 점검한다.", "sems": ["1학기"], "units": ["독서단원: 질문을 만들며 책을 읽어요"], "kind": "단일 학년"}, {"code": "[4국02-06]", "text": "바람직한 읽기 습관을 형성하고 읽기에 대한 자신감을 기른다.", "sems": ["1학기", "2학기"], "units": ["1학기 독서단원: 질문을 만들며 책을 읽어요", "2학기 독서: 생각을 나누며 책을 읽어요"], "kind": "두 학년 공통"}, {"code": "[4국03-02]", "text": "절차와 결과가 드러나게 정확한 표현으로 보고하는 글을 쓴다.", "sems": ["1학기"], "units": ["3. 자세하게 살펴요 › 2. 대상을 관찰하여 보고하는 글 쓰기"], "kind": "단일 학년"}, {"code": "[4국03-03]", "text": "대상에 대한 자신의 의견과 그렇게 생각한 이유가 드러나게 글을 쓴다.", "sems": ["1학기"], "units": ["5. 말과 글로 전하는 생각"], "kind": "단일 학년"}, {"code": "[4국04-01]", "text": "단어와 단어 간의 의미 관계를 파악한다.", "sems": ["1학기"], "units": ["3. 자세하게 살펴요 › 1. 낱말의 의미 관계 알기"], "kind": "단일 학년"}, {"code": "[4국05-01]", "text": "인물과 이야기의 흐름을 중심으로 작품을 감상한다.", "sems": ["1학기"], "units": ["1. 깊이 있게 읽어요"], "kind": "단일 학년"}, {"code": "[4국05-04]", "text": "감각적 표현에 유의하여 작품을 감상하고, 감각적 표현을 활용하여 자신의 생각이나 감정을 표현한다.", "sems": ["1학기"], "units": ["6. 경험을 표현해요"], "kind": "단일 학년"}, {"code": "[4국06-01]", "text": "인터넷에서 학습에 필요한 다양한 자료를 탐색하고 목적에 맞게 자료를 선택한다.", "sems": ["1학기"], "units": ["3. 자세하게 살펴요"], "kind": "단일 학년"}, {"code": "[4국01-02]", "text": "원인과 결과의 관계를 고려하여 내용을 예측하며 듣고 말한다.", "sems": ["2학기"], "units": ["6. 상상의 날개 › 1. 원인과 결과를 생각하며 듣기"], "kind": "단일 학년"}, {"code": "[4국04-05]", "text": "언어가 의사소통과 관계 형성의 수단임을 이해하고 국어를 소중히 여기는 태도를 지닌다.", "sems": ["2학기"], "units": ["2. 우리말 우리글"], "kind": "단일 학년"}, {"code": "[4국05-02]", "text": "자신의 경험을 바탕으로 작품 속 세계와 현실 세계를 비교하여 작품을 감상한다.", "sems": ["2학기"], "units": ["1. 비교하며 읽어요"], "kind": "단일 학년"}, {"code": "[4국05-03]", "text": "작품을 듣거나 읽고 마음에 드는 작품을 소개한다.", "sems": ["2학기"], "units": ["4. 책 속의 길을 따라 › 1. 작품을 읽고 생각이나 느낌 나누기"], "kind": "두 학년 공통"}, {"code": "[4국06-02]", "text": "매체를 활용하여 간단한 발표 자료를 만든다.", "sems": ["2학기"], "units": ["3. 의견을 모아서"], "kind": "두 학년 공통"}, {"code": "[4국06-03]", "text": "매체 소통 윤리를 고려하여 매체 자료를 활용하고 공유한다.", "sems": ["2학기"], "units": ["3. 의견을 모아서"], "kind": "단일 학년"}]}, {"name": "수학", "areas": ["수와 연산", "도형과 측정", "자료와 가능성", "변화와 관계"], "stds": [{"code": "[4수01-01]", "text": "큰 수의 필요성을 인식하면서 10000 이상의 큰 수에 대한 자릿값과 위치적 기수법을 이해하고, 수를 읽고 쓸 수 있다.", "sems": ["1학기"], "units": ["1. 큰 수"], "kind": "단일 학년"}, {"code": "[4수01-02]", "text": "다섯 자리 이상의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교하며 그 방법을 설명할 수 있다.", "sems": ["1학기"], "units": ["1. 큰 수"], "kind": "단일 학년"}, {"code": "[4수01-04]", "text": "곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈의 계산 원리를 이해하고 그 계산을 할 수 있다.", "sems": ["1학기"], "units": ["3. 곱셈과 나눗셈"], "kind": "두 학년 공통"}, {"code": "[4수01-07]", "text": "나누는 수가 두 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있다.", "sems": ["1학기"], "units": ["3. 곱셈과 나눗셈"], "kind": "단일 학년"}, {"code": "[4수01-08]", "text": "자연수의 덧셈, 뺄셈, 곱셈, 나눗셈과 관련한 여러 가지 상황에서 어림셈을 할 수 있다.", "sems": ["1학기"], "units": ["3. 곱셈과 나눗셈"], "kind": "두 학년 공통"}, {"code": "[4수02-01]", "text": "다양한 변화 규칙을 찾아 설명하고, 그 규칙을 수나 식으로 나타낼 수 있다.", "sems": ["1학기"], "units": ["6. 규칙과 관계"], "kind": "단일 학년"}, {"code": "[4수02-02]", "text": "계산식의 배열에서 규칙을 찾고, 계산 결과를 추측할 수 있다.", "sems": ["1학기"], "units": ["6. 규칙과 관계"], "kind": "단일 학년"}, {"code": "[4수02-03]", "text": "등호를 사용하여 크기가 같은 두 양의 관계를 식으로 나타낼 수 있다.", "sems": ["1학기"], "units": ["6. 규칙과 관계"], "kind": "단일 학년"}, {"code": "[4수03-02]", "text": "각과 직각을 이해하고, 직각과 비교하는 활동을 통하여 예각과 둔각을 구별할 수 있다.", "sems": ["1학기"], "units": ["2. 각도"], "kind": "두 학년 공통"}, {"code": "[4수03-04]", "text": "구체물이나 평면도형의 밀기, 뒤집기, 돌리기 활동을 통하여 그 변화를 이해한다.", "sems": ["1학기"], "units": ["4. 평면도형의 이동"], "kind": "단일 학년"}, {"code": "[4수03-05]", "text": "평면에서 점의 이동에 대해 위치와 방향을 이용하여 설명할 수 있다.", "sems": ["1학기"], "units": ["4. 평면도형의 이동"], "kind": "단일 학년"}, {"code": "[4수03-24]", "text": "각의 크기의 단위인 1도(°)를 알고, 각도기를 이용하여 각의 크기를 측정하고 어림할 수 있다.", "sems": ["1학기"], "units": ["2. 각도"], "kind": "단일 학년"}, {"code": "[4수04-01]", "text": "자료를 수집하여 그림그래프나 막대그래프로 나타내고 해석할 수 있다.", "sems": ["1학기"], "units": ["5. 막대그래프"], "kind": "두 학년 공통"}, {"code": "[4수01-13]", "text": "자릿값의 원리를 바탕으로 소수 두 자리 수와 소수 세 자리 수를 이해하고 읽고 쓸 수 있다.", "sems": ["2학기"], "units": ["3. 소수의 덧셈과 뺄셈"], "kind": "단일 학년"}, {"code": "[4수01-14]", "text": "소수의 크기를 비교하고 그 방법을 설명할 수 있다.", "sems": ["2학기"], "units": ["3. 소수의 덧셈과 뺄셈"], "kind": "단일 학년"}, {"code": "[4수01-15]", "text": "분모가 같은 분수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.", "sems": ["2학기"], "units": ["1. 분수의 덧셈과 뺄셈"], "kind": "단일 학년"}, {"code": "[4수01-16]", "text": "소수 두 자리 수의 범위에서 소수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다.", "sems": ["2학기"], "units": ["3. 소수의 덧셈과 뺄셈"], "kind": "단일 학년"}, {"code": "[4수03-03]", "text": "직선의 수직 관계와 평행 관계를 이해한다.", "sems": ["2학기"], "units": ["4. 사각형"], "kind": "단일 학년"}, {"code": "[4수03-08]", "text": "여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 이등변삼각형, 정삼각형을 이해하고, 그 성질을 탐구하고 설명할 수 있다.", "sems": ["2학기"], "units": ["2. 삼각형"], "kind": "단일 학년"}, {"code": "[4수03-09]", "text": "여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 직각삼각형, 예각삼각형, 둔각 삼각형을 이해한다.", "sems": ["2학기"], "units": ["2. 삼각형"], "kind": "단일 학년"}, {"code": "[4수03-10]", "text": "여러 가지 모양의 사각형에 대한 분류 활동을 통하여 직사각형, 정사각형, 사다리꼴, 평행사변형, 마름모를 이해하고, 그 성질을 탐구하고 설명할 수 있다.", "sems": ["2학기"], "units": ["4. 사각형"], "kind": "단일 학년"}, {"code": "[4수03-11]", "text": "다각형과 정다각형을 이해한다.", "sems": ["2학기"], "units": ["6. 다각형"], "kind": "단일 학년"}, {"code": "[4수03-12]", "text": "주어진 도형을 이용하여 여러 가지 모양을 만들거나 채우고 설명할 수 있다.", "sems": ["2학기"], "units": ["6. 다각형"], "kind": "단일 학년"}, {"code": "[4수03-25]", "text": "여러 가지 방법으로 삼각형과 사각형의 내각의 크기의 합을 추론하고, 자신의 추론 과정을 설명할 수 있다.", "sems": ["2학기"], "units": ["2. 삼각형"], "kind": "단일 학년"}, {"code": "[4수04-02]", "text": "자료를 수집하여 꺾은선그래프로 나타내고 해석할 수 있다.", "sems": ["2학기"], "units": ["5. 꺾은선그래프"], "kind": "단일 학년"}, {"code": "[4수04-03]", "text": "탐구 문제를 해결하기 위해 자료를 수집, 정리하여 막대그래프나 꺾은선그래프로 나타내고 해석할 수 있다.", "sems": ["2학기"], "units": ["5. 꺾은선그래프"], "kind": "단일 학년"}]}, {"name": "사회", "areas": ["지리 인식", "역사 일반·지역사", "경제", "정치", "지속가능한 세계", "자연환경과 인간 생활", "인문환경과 인간 생활"], "stds": [{"code": "[4사05-01]", "text": "우리 지역을 표현한 다양한 종류의 지도를 찾아보고, 지도의 요소를 이해한다.", "sems": ["1학기"], "units": ["지도로 만나는 우리 지역 (지도, 우리 지역의 위치와 특성)"], "kind": "단일 학년"}, {"code": "[4사05-02]", "text": "지도에서 우리 지역의 위치를 파악하고, 우리 지역의 지리 정보를 탐색한다.", "sems": ["1학기"], "units": ["지도로 만나는 우리 지역 (지도, 우리 지역의 위치와 특성)"], "kind": "단일 학년"}, {"code": "[4사06-01]", "text": "지역의 문화유산을 통해 문화유산의 의미와 유형을 알아보고, 문화유산의 가치를 탐색한다.", "sems": ["1학기"], "units": ["우리 지역의 국가유산·역사"], "kind": "단일 학년"}, {"code": "[4사06-02]", "text": "지역의 박물관, 기념관, 유적지 등을 체험하고 지역의 역사를 이해한다.", "sems": ["1학기"], "units": ["우리 지역의 국가유산·역사"], "kind": "단일 학년"}, {"code": "[4사07-01]", "text": "자원의 희소성으로 인해 경제활동에서 선택의 문제가 발생함을 이해하고, 경제활동에서 합리적 선택의 방법을 탐색한다.", "sems": ["1학기"], "units": ["경제활동과 지역 간 교류"], "kind": "단일 학년"}, {"code": "[4사07-02]", "text": "생산과 소비 활동을 파악하고, 인적⋅물적 교류의 사례를 통해 각 지역 및 사람들이 상호 의존 관계를 맺고 있음을 탐색한다.", "sems": ["1학기"], "units": ["경제활동과 지역 간 교류"], "kind": "단일 학년"}, {"code": "[4사08-01]", "text": "학교 자치 사례를 통하여 민주주의의 의미를 이해하고, 학교생활에서 민주주의를 실천하는 능력을 기른다.", "sems": ["2학기"], "units": ["민주주의와 자치 (학교생활 속 민주주의, 주민 자치)"], "kind": "단일 학년"}, {"code": "[4사08-02]", "text": "지역에서 이루어지는 민주주의 사례를 통해 주민 자치와 주민 참여의 중요성을 파악하고, 지역사회의 문제 해결에 참여하는 태도를 기른다.", "sems": ["2학기"], "units": ["민주주의와 자치 (학교생활 속 민주주의, 주민 자치)"], "kind": "단일 학년"}, {"code": "[4사09-01]", "text": "생활 주변에서 찾을 수 있는 여러 가지 문제를 파악하고, 그 문제를 합리적으로 해결하는 능력을 기른다.", "sems": ["2학기"], "units": ["지역문제를 해결하고 지역을 알리는 노력 › 지역문제의 해결 관련 차시"], "kind": "단일 학년"}, {"code": "[4사09-02]", "text": "지역의 자연환경, 역사, 문화, 생산물 등을 알리려는 지역사회의 노력을 알고 관심을 갖는다.", "sems": ["2학기"], "units": ["지역문제를 해결하고 지역을 알리는 노력"], "kind": "단일 학년"}, {"code": "[4사10-01]", "text": "여러 지역의 자연환경과 인문환경의 특징을 살펴보고, 환경의 이용과 개발에 따른 변화를 탐구한다.", "sems": ["2학기"], "units": ["지역문제를 해결하고 지역을 알리는 노력 › 지역의 환경과 변화 관련 차시"], "kind": "단일 학년"}, {"code": "[4사10-02]", "text": "사례에서 도시의 인구, 교통, 산업 등의 특징을 탐구하고, 도시에서의 삶의 모습을 이해한다.", "sems": ["2학기"], "units": ["지역문제를 해결하고 지역을 알리는 노력 › 도시의 특징 관련 차시"], "kind": "단일 학년"}]}, {"name": "과학", "areas": ["운동과 에너지", "물질", "지구와 우주", "생명", "과학과 사회"], "stds": [{"code": "[4과09-01]", "text": "자석과 여러 가지 물체를 가까이했을 때 나타나는 현상을 관찰하고, 자석과 자석에 붙는 물체 사이에 작용하는 힘의 특징을 말할 수 있다.", "sems": ["1학기"], "units": ["1. 자석의 이용"], "kind": "단일 학년"}, {"code": "[4과09-02]", "text": "자석과 자석을 가까이했을 때 나타나는 현상을 관찰하여 그 특징을 자석의 극과 관련지어 설명할 수 있다.", "sems": ["1학기"], "units": ["1. 자석의 이용"], "kind": "단일 학년"}, {"code": "[4과09-03]", "text": "자석을 이용하여 일상생활을 편리하게 하는 장치를 설계할 수 있다.", "sems": ["1학기"], "units": ["1. 자석의 이용"], "kind": "단일 학년"}, {"code": "[4과10-01]", "text": "물이 세 가지 상태로 변할 수 있음을 알고, 우리 주변에서 예를 찾을 수 있다.", "sems": ["1학기"], "units": ["2. 물의 상태 변화"], "kind": "단일 학년"}, {"code": "[4과10-02]", "text": "물이 얼 때, 얼음이 녹을 때, 물이 증발할 때와 끓을 때, 수증기가 응결할 때의 변화를 관찰할 수 있다.", "sems": ["1학기"], "units": ["2. 물의 상태 변화"], "kind": "단일 학년"}, {"code": "[4과10-03]", "text": "물의 상태 변화를 이용하여 물을 얻을 수 있는 장치를 설계하고 만들 수 있다.", "sems": ["1학기"], "units": ["2. 물의 상태 변화"], "kind": "단일 학년"}, {"code": "[4과11-01]", "text": "흐르는 물의 작용과 강 주변 지형의 특징을 관련지을 수 있다.", "sems": ["1학기"], "units": ["3. 땅의 변화"], "kind": "단일 학년"}, {"code": "[4과11-02]", "text": "화산의 의미와 화산 활동으로 나오는 물질을 알고, 화산 활동을 모형으로 표현할 수 있다.", "sems": ["1학기"], "units": ["3. 땅의 변화"], "kind": "단일 학년"}, {"code": "[4과11-03]", "text": "화성암을 관찰하고 분류할 수 있다.", "sems": ["1학기"], "units": ["3. 땅의 변화"], "kind": "단일 학년"}, {"code": "[4과11-04]", "text": "화산 활동과 지진이 우리 생활에 미치는 영향을 조사하여, 대처 방법을 실천할 수 있다.", "sems": ["1학기"], "units": ["3. 땅의 변화"], "kind": "단일 학년"}, {"code": "[4과12-01]", "text": "균류⋅원생생물⋅세균을 관찰하여 특징과 사는 곳을 설명할 수 있다.", "sems": ["1학기"], "units": ["4. 다양한 생물과 우리 생활"], "kind": "단일 학년"}, {"code": "[4과12-02]", "text": "균류⋅원생생물⋅세균이 우리 생활에 미치는 영향을 조사하여 발표할 수 있다.", "sems": ["1학기"], "units": ["4. 다양한 생물과 우리 생활"], "kind": "단일 학년"}, {"code": "[4과12-03]", "text": "우리 생활에 생명과학이 이용되는 사례를 소개하는 자료를 만들어 공유할 수 있다.", "sems": ["1학기"], "units": ["4. 다양한 생물과 우리 생활"], "kind": "단일 학년"}, {"code": "[4과13-01]", "text": "달의 모양과 표면, 달의 위상변화를 관찰하여 밤하늘 관찰에 흥미를 가질 수 있다.", "sems": ["2학기"], "units": ["1. 밤하늘 관찰"], "kind": "단일 학년"}, {"code": "[4과13-02]", "text": "태양계 구성원을 알고, 태양과 행성을 조사할 수 있다.", "sems": ["2학기"], "units": ["1. 밤하늘 관찰"], "kind": "단일 학년"}, {"code": "[4과13-03]", "text": "별의 정의를 알고, 북극성 주변의 별자리를 관찰할 수 있다.", "sems": ["2학기"], "units": ["1. 밤하늘 관찰"], "kind": "단일 학년"}, {"code": "[4과14-01]", "text": "생태계의 구성 요소를 조사하여 생물 요소와 비생물 요소로 분류할 수 있다.", "sems": ["2학기"], "units": ["2. 생물과 환경"], "kind": "단일 학년"}, {"code": "[4과14-02]", "text": "생물 요소들의 먹고 먹히는 관계를 조사하여 먹이그물로 표현할 수 있다.", "sems": ["2학기"], "units": ["2. 생물과 환경"], "kind": "단일 학년"}, {"code": "[4과14-03]", "text": "인간 활동이 생태계에 미치는 영향을 조사하고, 생태계 보전을 위해 우리가 할 수 있는 일을 토의하여 실천할 수 있다.", "sems": ["2학기"], "units": ["2. 생물과 환경"], "kind": "단일 학년"}, {"code": "[4과15-01]", "text": "실험을 통해 기체가 무게가 있음을 설명할 수 있다.", "sems": ["2학기"], "units": ["3. 여러 가지 기체"], "kind": "단일 학년"}, {"code": "[4과15-02]", "text": "온도나 압력에 따라 기체의 부피가 달라지는 현상을 관찰하고, 우리 주변에서 예를 찾을 수 있다.", "sems": ["2학기"], "units": ["3. 여러 가지 기체"], "kind": "단일 학년"}, {"code": "[4과15-03]", "text": "일상생활에서 이용되는 기체의 종류와 성질을 조사하고, 여러 가지 기체에 대해 흥미를 느낄 수 있다.", "sems": ["2학기"], "units": ["3. 여러 가지 기체"], "kind": "단일 학년"}, {"code": "[4과15-04]", "text": "기체의 성질을 이용하여 작동시킬 수 있는 장치를 설계하고 만들 수 있다.", "sems": ["2학기"], "units": ["3. 여러 가지 기체"], "kind": "단일 학년"}, {"code": "[4과16-01]", "text": "기후변화 현상의 예를 알고, 기후변화가 인간의 활동과 관련되어 있음을 토의할 수 있다.", "sems": ["2학기"], "units": ["4. 기후변화와 우리 생활"], "kind": "단일 학년"}, {"code": "[4과16-02]", "text": "기후변화의 심각성에 관심을 가지고, 기후변화가 우리 생활과 환경에 미치는 영향을 설명할 수 있다.", "sems": ["2학기"], "units": ["4. 기후변화와 우리 생활"], "kind": "단일 학년"}, {"code": "[4과16-03]", "text": "기후변화 대응 방법을 조사하고, 생활 속에서 기후변화 대응 방법을 실천할 수 있다.", "sems": ["2학기"], "units": ["4. 기후변화와 우리 생활"], "kind": "단일 학년"}]}, {"name": "도덕", "areas": ["자신과의 관계", "타인과의 관계", "사회·공동체와의 관계", "자연과의 관계"], "stds": [{"code": "[4도01-02]", "text": "정직의 의미를 알고 모범적인 사례를 탐색하여 바르게 행동하려는 태도를 기른다.", "sems": ["1학기"], "units": ["1. 바르고 곧은 길"], "kind": "단일 학년"}, {"code": "[4도01-04]", "text": "다른 사람의 관점을 수용할 수 있는지를 도덕적으로 검토하고 도덕규범을 내면화하여 도덕적으로 행동할 수 있는 자세를 기른다.", "sems": ["1학기"], "units": ["2. 도덕적인 나"], "kind": "단일 학년"}, {"code": "[4도02-02]", "text": "친구 사이의 배려에 대한 올바른 이해를 바탕으로 일상생활에서 배려에 기반한 도덕적 관계를 맺을 수 있는 방안을 탐색한다.", "sems": ["1학기"], "units": ["3. 배려하는 우리"], "kind": "단일 학년"}, {"code": "[4도02-03]", "text": "공감의 태도가 필요한 이유를 이해하고 도덕적 상상력을 바탕으로 대상과 상황에 따라 감정을 나누는 방법을 탐구하여 실천한다.", "sems": ["1학기"], "units": ["2. 도덕적인 나"], "kind": "두 학년 공통"}, {"code": "[4도03-02]", "text": "디지털 사회에서 발생하는 다양한 문제를 살펴보고, 해결 방안을 탐구하여 정보통신 윤리에 대한 민감성을 기른다.", "sems": ["2학기"], "units": ["5. 바람직한 디지털 사회"], "kind": "단일 학년"}, {"code": "[4도03-03]", "text": "통일의 필요성을 이해하고, 통일 감수성을 길러 바람직한 통일의 방향을 모색한다.", "sems": ["2학기"], "units": ["6. 통일로 가는 한 걸음"], "kind": "단일 학년"}, {"code": "[4도04-02]", "text": "인간과 자연이 함께 살아야 하는 이유를 이해하고 공생을 위한 구체적인 실천 계획을 세우며 생태 감수성을 기른다.", "sems": ["2학기"], "units": ["7. 자연은 소중해요"], "kind": "단일 학년"}]}, {"name": "체육", "areas": ["운동", "스포츠", "표현"], "stds": [{"code": "[4체01-01]", "text": "운동과 체력의 의미를 이해하고 관계를 파악한다.", "sems": ["1학기", "2학기"], "units": ["1학기 1. 운동", "2학기 1. 운동 (운동 생활 습관)"], "kind": "두 학년 반복·심화"}, {"code": "[4체01-02]", "text": "기본 체력운동의 방법과 절차를 익히며 자신의 수준에 맞는 운동을 시도한다.", "sems": ["1학기", "2학기"], "units": ["1학기 1. 운동", "2학기 1. 운동 (운동 생활 습관)"], "kind": "두 학년 반복·심화"}, {"code": "[4체01-03]", "text": "운동과 건강의 의미를 이해하고 관계를 파악한다.", "sems": ["1학기", "2학기"], "units": ["1학기 1. 운동", "2학기 1. 운동 (운동 생활 습관)"], "kind": "두 학년 반복·심화"}, {"code": "[4체01-04]", "text": "건강을 위한 바른 생활 습관을 이해하고 생활 속에서 규칙적으로 실천한다.", "sems": ["1학기", "2학기"], "units": ["1학기 1. 운동", "2학기 1. 운동 (운동 생활 습관)"], "kind": "두 학년 반복·심화"}, {"code": "[4체01-05]", "text": "자신의 신체적 특징을 긍정적으로 인식하고 운동 계획을 세워 안전하게 활동한다.", "sems": ["1학기", "2학기"], "units": ["1학기 1. 운동", "2학기 1. 운동 (운동 생활 습관)"], "kind": "두 학년 반복·심화"}, {"code": "[4체01-06]", "text": "운동과 건강한 생활 습관 형성에 관심을 갖고 적극적으로 실천한다.", "sems": ["1학기", "2학기"], "units": ["1학기 1. 운동", "2학기 1. 운동 (운동 생활 습관)"], "kind": "두 학년 반복·심화"}, {"code": "[4체02-01]", "text": "스포츠의 의미와 유형을 파악한다.", "sems": ["1학기", "2학기"], "units": ["1학기 2. 스포츠", "2학기 2. 스포츠", "2학기 2. 스포츠 › 인라인스케이트로 ": "[6국02-04]", "text": "문제 상황과 관련된 다양한 관점의 글을 읽고 이를 문제 해결에 활용한다.", "sems": ["1학기"], "units": ["5. 의논하며 토의해요"], "kind": "단일 학년"}, {"code": "[6국03-01]", "text": "알맞은 내용을 선정하여 대상의 특성이 나타나게 설명하는 글을 쓴다.", "sems": ["1학기"], "units": ["4. 대상을 설명해요 › 2. 대상을 설명하는 글 쓰기"], "kind": "단일 학년"}, {"code": "[6국03-03]", "text": "체험한 일에 대한 감상을 나타내는 글을 쓴다.", "sems": ["1학기"], "units": ["2. 체험한 일을 글로 써요"], "kind": "단일 학년"}, {"code": "[6국03-05]", "text": "쓰기 과정을 점검⋅조정하며 글을 쓰고, 글 전체를 대상으로 통일성 있게 고쳐 쓴다.", "sems": ["1학기"], "units": ["4. 대상을 설명해요 › 2. 대상을 설명하는 글 쓰기"], "kind": "두 학년 공통"}, {"code": "[6국05-01]", "text": "작가의 의도를 생각하며 작품을 읽는다.", "sems": ["1학기"], "units": ["6. 작품을 즐겨요"], "kind": "단일 학년"}, {"code": "[6국05-02]", "text": "비유적 표현의 효과에 유의하여 작품을 감상한다.", "sems": ["1학기"], "units": ["6. 작품을 즐겨요 › 1. 비유적 표현을 알고 시 낭송하기"], "kind": "단일 학년"}, {"code": "[6국05-04]", "text": "인상적인 부분을 중심으로 작품에 대한 의견을 나눈다.", "sems": ["1학기"], "units": ["6. 작품을 즐겨요"], "kind": "단일 학년"}, {"code": "[6국06-01]", "text": "정보 검색 도구를 활용하여 자신의 목적에 맞는 매체 자료를 찾는다.", "sems": ["1학기"], "units": ["3. 발표하고 질문해요"], "kind": "단일 학년"}]}, {"name": "수학", "areas": ["수와 연산", "변화와 관계", "도형과 측정"], "stds": [{"code": "[6수01-01]", "text": "덧셈, 뺄셈, 곱셈, 나눗셈의 혼합 계산에서 계산하는 순서를 알고, 혼합 계산을 할 수 있다.", "sems": ["1학기"], "units": ["1. 자연수의 혼합 계산"], "kind": "단일 학년"}, {"code": "[6수01-04]", "text": "약수, 공약수, 최대공약수를 이해하고 구할 수 있다.", "sems": ["1학기"], "units": ["2. 약수와 배수"], "kind": "단일 학년"}, {"code": "[6수01-05]", "text": "배수, 공배수, 최소공배수를 이해하고 구할 수 있다.", "sems": ["1학기"], "units": ["2. 약수와 배수"], "kind": "단일 학년"}, {"code": "[6수01-06]", "text": "크기가 같은 분수를 만드는 방법을 이해하고, 분수를 약분, 통분할 수 있다.", "sems": ["1학기"], "units": ["4. 약분과 통분"], "kind": "단일 학년"}, {"code": "[6수01-07]", "text": "분모가 다른 분수의 크기를 비교하고 그 방법을 설명할 수 있다.", "sems": ["1학기"], "units": ["4. 약분과 통분"], "kind": "단일 학년"}, {"code": "[6수01-08]", "text": "분모가 다른 분수의 덧셈과 뺄셈의 계산 원리를 탐구하고 그 계산을 할 수 있다.", "sems": ["1학기"], "units": ["5. 분수의 덧셈과 뺄셈"], "kind": "단일 학년"}, {"code": "[6수01-11]", "text": "분수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다.", "sems": ["1학기"], "units": ["1. 자연수의 혼합 계산"], "kind": "두 학년 공통"}, {"code": "[6수01-15]", "text": "소수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다.", "sems": ["1학기"], "units": ["1. 자연수의 혼합 계산"], "kind": "두 학년 공통"}, {"code": "[6수02-01]", "text": "한 양이 변할 때 다른 양이 그에 종속하여 변하는 대응 관계를 나타낸 표에서 규칙을 찾아 설명하고, □, △ 등을 사용하여 식으로 나타낼 수 있다.", "sems": ["1학기"], "units": ["3. 대응 관계"], "kind": "단일 학년"}, {"code": "[6수03-11]", "text": "평면도형의 둘레를 이해하고, 기본적인 평면도형의 둘레를 구할 수 있다.", "sems": ["1학기"], "units": ["6. 다각형의 둘레와 넓이"], "kind": "단일 학년"}, {"code": "[6수03-12]", "text": "넓이 단위 1cm², 1m², 1km²를 알며, 그 관계를 이해한다.", "sems": ["1학기"], "units": ["6. 다각형의 둘레와 넓이"], "kind": "단일 학년"}, {"code": "[6수03-13]", "text": "직사각형과 정사각형의 넓이를 구하는 방법을 이해하고, 이를 구할 수 있다.", "sems": ["1학기"], "units": ["6. 다각형의 둘레와 넓이"], "kind": "단일 학년"}, {"code": "[6수03-14]", "text": "평행사변형, 삼각형, 사다리꼴, 마름모의 넓이를 구하는 방법을 다양하게 추론하고, 이와 관련된 문제를 해결할 수 있다.", "sems": ["1학기"], "units": ["6. 다각형의 둘레와 넓이"], "kind": "단일 학년"}]}, {"name": "사회", "areas": ["지리 인식", "자연환경과 인간 생활", "인문환경과 인간 생활", "법"], "stds": [{"code": "[6사01-01]", "text": "우리나라 산지, 하천, 해안 지형의 위치를 확인하고 지형의 분포 특징을 탐구한다.", "sems": ["1학기"], "units": ["우리나라의 지형·기후와 자연재해"], "kind": "단일 학년"}, {"code": "[6사01-02]", "text": "독도의 지리적 특성과 독도에 대한 역사 기록을 바탕으로 영토로서 독도의 중요성을 이해한다.", "sems": ["1학기"], "units": ["국토의 위치와 지리 탐구 (국토 여행, 독도)"], "kind": "단일 학년"}, {"code": "[6사02-01]", "text": "우리나라의 계절별 기후 특징을 자료에서 탐구하고, 기후변화로 인한 자연재해의 심각성을 이해한다.", "sems": ["1학기"], "units": ["우리나라의 지형·기후와 자연재해"], "kind": "단일 학년"}, {"code": "[6사02-02]", "text": "우리나라의 지역별 인구 분포의 특징을 알아보고, 이에 따른 문제점과 해결 방안을 탐색한다.", "sems": ["1학기"], "units": ["우리나라의 인구 분포 › 인구 분포 관련 차시"], "kind": "단일 학년"}, {"code": "[6사03-01]", "text": "일상 사례에서 법의 의미와 역할을 이해하고, 헌법에 규정된 인권이 일상생활에서 구현되는 사례를 조사하여 인권 친화적 태도를 기른다.", "sems": ["1학기"], "units": ["법의 역할과 인권 (인권 보호, 법과 인권의 보장)"], "kind": "단일 학년"}, {"code": "[6사03-02]", "text": "일상생활에서 인권이 침해되는 사례를 찾아 그 해결 방안을 탐색하고, 인권을 보호하는 활동에 참여한다.", "sems": ["1학기"], "units": ["법의 역할과 인권 (인권 보호, 법과 인권의 보장)"], "kind": "단일 학년"}]}, {"name": "과학", "areas": ["지구와 우주", "운동과 에너지", "물질", "생명", "과학과 사회"], "stds": [{"code": "[6과01-01]", "text": "지층의 특징을 알고, 지층의 형성 과정을 모형으로 표현할 수 있다.", "sems": ["1학기"], "units": ["1. 지층과 화석"], "kind": "단일 학년"}, {"code": "[6과01-02]", "text": "지층이 퇴적암으로 이루어짐을 알고, 퇴적암을 알갱이의 크기에 따라 분류할 수 있다.", "sems": ["1학기"], "units": ["1. 지층과 화석"], "kind": "단일 학년"}, {"code": "[6과01-03]", "text": "화석의 생성 과정을 모형으로 설명하고, 지구의 과거 생물과 환경을 추리하는 활동을 통해 화석의 가치를 인식할 수 있다.", "sems": ["1학기"], "units": ["1. 지층과 화석"], "kind": "단일 학년"}, {"code": "[6과02-01]", "text": "물체를 보기 위해서 빛이 있어야 함을 알고, 빛의 성질에 대해 흥미를 느낄 수 있다.", "sems": ["1학기"], "units": ["2. 빛의 성질"], "kind": "단일 학년"}, {"code": "[6과02-02]", "text": "빛이 나아가는 현상을 관찰하여 빛이 직진, 반사, 굴절하는 성질이 있음을 말할 수 있다.", "sems": ["1학기"], "units": ["2. 빛의 성질"], "kind": "단일 학년"}, {"code": "[6과02-03]", "text": "거울과 렌즈의 쓰임새를 조사하고 거울이나 렌즈를 이용한 장치를 창의적으로 만들 수 있다.", "sems": ["1학기"], "units": ["2. 빛의 성질"], "kind": "단일 학년"}, {"code": "[6과03-01]", "text": "용해 현상의 의미를 알고, 용질의 종류와 물의 온도에 따라 물에 녹는 용질의 양이 달라짐을 비교할 수 있다.", "sems": ["1학기"], "units": ["3. 용해와 용액"], "kind": "단일 학년"}, {"code": "[6과03-02]", "text": "용질이나 용매의 양에 따라 용액의 진하기가 달라짐을 관찰하고, 용액의 상대적인 진하기를 비교할 수 있다.", "sems": ["1학기"], "units": ["3. 용해와 용액"], "kind": "단일 학년"}, {"code": "[6과03-03]", "text": "일상생활에서 용액이 쓰이는 사례를 조사하여 용액의 필요성을 알리는 자료를 만들고 공유할 수 있다.", "sems": ["1학기"], "units": ["3. 용해와 용액"], "kind": "단일 학년"}, {"code": "[6과04-01]", "text": "뼈와 근육의 생김새를 관찰하고 모형을 만들어 몸이 움직이는 원리를 설명할 수 있다.", "sems": ["1학기"], "units": ["4. 우리 몸의 구조와 기능"], "kind": "단일 학년"}, {"code": "[6과04-02]", "text": "소화, 순환, 호흡, 배설 기관의 구조와 기능을 알아보고, 우리 몸의 여러 기관이 서로 관련되어 있음을 설명할 수 있다.", "sems": ["1학기"], "units": ["4. 우리 몸의 구조와 기능"], "kind": "단일 학년"}, {"code": "[6과04-03]", "text": "우리 몸의 여러 기관과 관련된 질병을 조사하고, 건강을 유지하기 위한 생활 방식을 실천할 수 있다.", "sems": ["1학기"], "units": ["4. 우리 몸의 구조와 기능"], "kind": "단일 학년"}, {"code": "[6과05-01]", "text": "알갱이의 크기가 다른 고체 혼합물과 골고루 섞이지 않는 액체 혼합물을 분리할 수 있다.", "sems": ["2학기"], "units": ["1. 혼합물의 분리"], "kind": "단일 학년"}, {"code": "[6과05-02]", "text": "물에 용해되는 성질을 이용하여 고체 혼합물을 분리하고, 물을 증발시켜 물에 용해된 고체 물질을 분리할 수 있다.", "sems": ["2학기"], "units": ["1. 혼합물의 분리"], "kind": "단일 학년"}, {"code": "[6과05-03]", "text": "지속가능한 삶을 위한 과학기술 사례 중 혼합물의 분리를 이용한 장치를 조사하여 공유할 수 있다.", "sems": ["2학기"], "units": ["1. 혼합물의 분리"], "kind": "단일 학년"}, {"code": "[6과06-01]", "text": "기상 요소를 조사하고, 날씨가 우리 생활에 주는 영향을 인식할 수 있다.", "sems": ["2학기"], "units": ["2. 날씨와 우리 생활"], "kind": "단일 학년"}, {"code": "[6과06-02]", "text": "이슬, 안개, 구름을 관찰하고, 공통점과 차이점을 찾을 수 있다.", "sems": ["2학기"], "units": ["2. 날씨와 우리 생활"], "kind": "단일 학년"}, {"code": "[6과06-03]", "text": "고기압과 저기압의 분포에 따른 날씨의 특징을 기상 요소로 표현할 수 있다.", "sems": ["2학기"], "units": ["2. 날씨와 우리 생활"], "kind": "단일 학년"}, {"code": "[6과07-01]", "text": "물체의 따뜻하고 차가운 정도를 온도로 표현함을 알고, 온도계를 이용하여 온도를 측정할 수 있다.", "sems": ["2학기"], "units": ["3. 열과 우리 생활"], "kind": "단일 학년"}, {"code": "[6과07-02]", "text": "온도가 다른 두 물체가 접촉했을 때 두 물체의 온도 변화를 관찰하고 그 원인을 추리할 수 있다.", "sems": ["2학기"], "units": ["3. 열과 우리 생활"], "kind": "단일 학년"}, {"code": "[6과07-03]", "text": "주위에서 열의 이동으로 나타나는 현상을 관찰하여 열의 이동 방식이 다양함을 설명할 수 있다.", "sems": ["2학기"], "units": ["3. 열과 우리 생활"], "kind": "단일 학년"}, {"code": "[6과07-04]", "text": "일상생활에서 단열을 이용하는 사례를 조사하고, 온도를 오랫동안 일정하게 유지할 수 있는 장치를 창의적으로 만들 수 있다.", "sems": ["2학기"], "units": ["3. 열과 우리 생활"], "kind": "단일 학년"}, {"code": "[6과08-01]", "text": "우리가 생활에서 이용하는 다양한 자원을 조사하고, 자원의 유한함을 설명할 수 있다.", "sems": ["2학기"], "units": ["4. 자원과 에너지"], "kind": "단일 학년"}, {"code": "[6과08-02]", "text": "재생에너지의 종류를 조사하고, 에너지를 지속가능하게 이용하는 방법에 관심을 갖는다.", "sems": ["2학기"], "units": ["4. 자원과 에너지"], "kind": "단일 학년"}, {"code": "[6과08-03]", "text": "자원과 에너지의 효율적인 이용 방법에 대해 탐색하고, 생활 속에서 실천할 수 있는 다양한 사례를 공유할 수 있다.", "sems": ["2학기"], "units": ["4. 자원과 에너지"], "kind": "단일 학년"}]}, {"name": "도덕", "areas": ["자신과의 관계", "사회·공동체와의 관계"], "stds": [{"code": "[6도01-01]", "text": "자주적인 삶에 대한 이해를 바탕으로 자신의 생활계획을 세우고 실천하여 주체적인 삶의 태도를 기른다.", "sems": ["1학기"], "units": ["1. 내 삶의 주인이 되는 나"], "kind": "단일 학년"}, {"code": "[6도01-02]", "text": "생활  "[6수03-19]", "text": "직육면체와 정육면체의 부피를 구하는 방법을 이해하고, 이를 구할 수 있다.", "sems": ["1학기"], "units": ["6. 직육면체의 부피와 겉넓이"], "kind": "단일 학년"}, {"code": "[6수04-02]", "text": "자료를 수집하여 띠그래프나 원그래프로 나타내고 해석할 수 있다.", "sems": ["1학기"], "units": ["5. 여러 가지 그래프"], "kind": "단일 학년"}, {"code": "[6수04-03]", "text": "탐구 문제를 설정하고, 그에 맞는 자료를 수집, 정리하여 적절한 그래프로 나타내고 해석할 수 있다.", "sems": ["1학기"], "units": ["5. 여러 가지 그래프"], "kind": "단일 학년"}]}, {"name": "사회", "areas": ["한국사", "지속가능한 세계", "정치", "지리 인식"], "stds": [{"code": "[6사07-01]", "text": "분단으로 나타난 문제점과 분단과 관련된 장소를 평화의 장소로 만들려는 노력 등을 알아보고, 평화 통일을 위해 우리가 할 수 있는 일을 탐색한다.", "sems": ["1학기"], "units": ["평화 통일을 위한 노력, 민주화와 산업화"], "kind": "단일 학년"}, {"code": "[6사07-02]", "text": "민주화와 산업화로 인해 달라진 생활 문화를 사례를 들어 이해한다.", "sems": ["1학기"], "units": ["평화 통일을 위한 노력, 민주화와 산업화"], "kind": "단일 학년"}, {"code": "[6사08-01]", "text": "민주주의에서 선거의 의미와 역할을 파악하고, 시민의 주권 행사를 위해 선거에 참여하는 태도를 기른다.", "sems": ["1학기"], "units": ["민주주의와 선거·국가기관·시민 참여·미디어"], "kind": "단일 학년"}, {"code": "[6사08-02]", "text": "민주 국가에서 국회, 행정부, 법원이 하는 일에 대해 이해하고, 각 국가기관의 권력을 분립 하는 이유를 탐색한다.", "sems": ["1학기"], "units": ["민주주의와 선거·국가기관·시민 참여·미디어"], "kind": "단일 학년"}, {"code": "[6사08-03]", "text": "민주주의에서 미디어의 의미와 역할을 이해하고, 여러 가지 미디어의 내용을 비판적으로 분석하여 올바르게 이용하는 태도를 기른다.", "sems": ["1학기"], "units": ["민주주의와 선거·국가기관·시민 참여·미디어"], "kind": "단일 학년"}, {"code": "[6사09-01]", "text": "세계를 표현하는 다양한 공간 자료의 특징을 이해하고, 지구본과 세계지도에서 위치를 표현하는 방법을 익힌다.", "sems": ["1학기"], "units": ["세계를 표현하는 자료, 세계 여러 국가의 위치와 영토"], "kind": "단일 학년"}, {"code": "[6사09-02]", "text": "세계 주요 대륙과 대양을 파악하고, 우리나라 및 세계 여러 국가의 위치와 영토의 특징을 이해한다.", "sems": ["1학기"], "units": ["세계를 표현하는 자료, 세계 여러 국가의 위치와 영토"], "kind": "단일 학년"}]}, {"name": "과학", "areas": ["운동과 에너지", "지구와 우주", "생명", "물질", "과학과 사회"], "stds": [{"code": "[6과11-01]", "text": "생물을 이루고 있는 기본 단위인 세포를 현미경으로 관찰할 수 있다.", "sems": ["1학기"], "units": ["3. 식물의 구조와 기능"], "kind": "단일 학년"}, {"code": "[6과11-02]", "text": "식물의 각 기관의 구조를 관찰하고, 기능을 알아보는 실험을 수행하여 식물 각 기관의 구조와 기능을 설명할 수 있다.", "sems": ["1학기"], "units": ["3. 식물의 구조와 기능"], "kind": "단일 학년"}, {"code": "[6과11-03]", "text": "여러 가지 식물의 특징을 설명하는 자료를 만들어 공유할 수 있다.", "sems": ["1학기"], "units": ["3. 식물의 구조와 기능"], "kind": "단일 학년"}, {"code": "[6과12-01]", "text": "하루 동안 태양과 별을 관찰하여 위치 변화의 규칙성을 찾을 수 있다.", "sems": ["1학기"], "units": ["4. 지구의 운동"], "kind": "단일 학년"}, {"code": "[6과12-02]", "text": "지구의 자전을 알고, 낮과 밤이 생기는 이유를 설명할 수 있다.", "sems": ["1학기"], "units": ["4. 지구의 운동"], "kind": "단일 학년"}, {"code": "[6과12-03]", "text": "지구의 공전을 알고, 계절에 따라 달라지는 별자리를 관찰할 수 있다.", "sems": ["1학기"], "units": ["4. 지구의 운동"], "kind": "단일 학년"}, {"code": "[6과13-01]", "text": "태양 고도 측정기로 하루 동안 태양 고도, 그림자 길이, 기온을 측정하여 이들의 관계를 찾을 수 있다.", "sems": ["1학기"], "units": ["4. 지구의 운동"], "kind": "단일 학년"}, {"code": "[6과13-02]", "text": "계절에 따른 태양의 남중 고도와 낮의 길이 사이의 관계를 자료에 근거하여 추론할 수 있다.", "sems": ["1학기"], "units": ["4. 지구의 운동"], "kind": "단일 학년"}, {"code": "[6과13-03]", "text": "계절 변화의 원인을 지구의 자전축이 기울어진 채 공전하는 것으로 설명할 수 있다.", "sems": ["1학기"], "units": ["4. 지구의 운동"], "kind": "단일 학년"}]}, {"name": "도덕", "areas": ["자신과의 관계", "타인과의 관계", "사회·공동체와의 관계"], "stds": [{"code": "[6도01-03]", "text": "자기가 하고 싶은 일을 선택할 때 도덕적 고려의 필요성을 알고 자신의 특기와 적성을 탐색하여 진로계획을 수립한다.", "sems": ["1학기"], "units": ["1. 나는 꿈 요리사"], "kind": "단일 학년"}, {"code": "[6도02-02]", "text": "편견이 발생하는 이유를 탐색하여 해결 방안을 살펴보고, 다양성 존중을 바탕으로 다른 사람과 올바른 관계를 맺기 위한 실천 방안을 탐구한다.", "sems": ["1학기"], "units": ["2. 다름을 존중하는 우리"], "kind": "단일 학년"}, {"code": "[6도02-03]", "text": "인간과 인공지능 로봇 간의 다양한 관계를 파악하고 도덕에 기반을 둔 관계 형성의 필요성을 탐구한다.", "sems": ["1학기"], "units": ["3. 인공지능 로봇 그리고 나"], "kind": "단일 학년"}]}, {"name": "실과", "areas": ["인간 발달과 주도적 삶", "지속가능한 기술과 융합", "생활환경과 지속가능한 선택"], "stds": [{"code": "[6실01-03]", "text": "건강한 가정생활을 위해 가족원 모두에게 다양한 요구가 있음을 이해하여 서로에 대한 배려와 돌봄을 실천한다.", "sems": ["1학기"], "units": ["1. 가정생활과 진로"], "kind": "단일 학년"}, {"code": "[6실01-06]", "text": "가정일을 수행하는 과정에서 일의 가치와 중요성을 이해하고, 가정생활을 유지하는 데 필요한 가정일의 종류를 탐색한다.", "sems": ["1학기"], "units": ["1. 가정생활과 진로"], "kind": "단일 학년"}, {"code": "[6실01-07]", "text": "직업의 필요성을 이해하고 적   document.getElementById('mode-subj').setAttribute('aria-selected', mode==='subj');
}
const KIND = {'두 학년 공통':'공통','두 학년 반복·심화':'반복·심화'};
function renderGrade(g){
  main.innerHTML = g.subjects.map(s => {
    const band = SUB[s.name].bands.find(b => b.band === g.band);
    const rows = band.rows.filter(r => s.areas.includes(r[0]));
    const sems = [...new Set(s.stds.flatMap(x => x.sems))].sort();
    const blocks = sems.map(se => {
      const list = s.stds.filter(x => x.sems.includes(se));
      return `<div class="sem"><h3>${esc(se)} · ${list.length}개</h3><ul>${list.map(x => {
        const u = x.units.filter(t => x.sems.length < 2 || t.startsWith(se[0])).map(t => t.replace(/^\d학기 /,''));
        return `<li><span class="std"><b>${esc(x.code)}</b> ${esc(x.text)}</span>
          <span class="chips"><span class="chip unit">${esc(u.join(' / '))}</span>${KIND[x.kind] ? `<span class="chip k">${KIND[x.kind]}</span>` : ''}</span></li>`;
      }).join('')}</ul></div>`;
    }).join('');
    return `<section class="subj"><h2>${esc(s.name)} <small>${g.grade}학년 · 성취기준 ${s.stds.length}개</small></h2>
      <div class="sems">${blocks}</div>
      ${rows.length ? `<details><summary>${g.grade}학년 ${esc(s.name)} 영역 성취수준 (${esc(g.band)} 기준)</summary>
      <div class="table">${head}${rows.map(rowHtml).join('')}</div></details>` : ''}</section>`;
  }).join('') + (g.grade >= 5 ? `<section class="subj"><h2>아직 배치하지 못한 성취기준 <small>5~6학년군 · 2학기 계획서 미제출 · ${D.unplaced.length}개</small></h2>
      <details><summary>목록 펼치기</summary><div class="sem"><ul>${D.unplaced.map(x => `<li><span class="std"><b>${esc(x.code)}</b> ${esc(x.text)}</span>
      <span class="chips"><span class="chip">${esc(x.subj)} · ${esc(x.group)}</span></span></li>`).join('')}</ul></div></details></section>` : '');
  note.textContent = '※ 성취기준은 2022 개정 교육과정 원문이고, 학기·단원은 2026학년도 학교 연간 지도 계획과 대조해 배치했습니다(자동 대조 + 교사 검토 보정). ' + D.missing;
}
function renderSubject(s){
  main.innerHTML = s.bands.map(b => `
    <section class="band"><h2>${esc(b.band)} <small>${esc(s.name)} · ${b.rows.length}개 영역</small></h2>
    <div class="table">${head}${b.rows.map(rowHtml).join('')}</div></section>`).join('');
  note.textContent = '※ ' + D.note + ' A·B·C 문구는 평가원 성취수준 일반적 특성을 영역에 적용한 정리본으로, 평가원 원문과 다를 수 있습니다.';
}
function render(){
  const list = mode === 'grade' ? D.grades : D.subjects;
  if (idx >= list.length) idx = 0;
  renderTabs();
  mode === 'grade' ? renderGrade(D.grades[idx]) : renderSubject(D.subjects[idx]);
  save();
}
document.getElementById('mode-grade').onclick = () => { mode='grade'; idx=0; render(); };
document.getElementById('mode-subj').onclick = () => { mode='subj'; idx=0; render(); };
try{ const v = JSON.parse(localStorage.getItem('view')||'null'); if (v && (v.mode==='grade'||v.mode==='subj')) { mode=v.mode; idx=+v.idx||0; } }catch(e){}
render();
</script>
