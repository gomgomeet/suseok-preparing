<title>초등 교과 성취수준</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 상단 고정 교과 탭 → 학년군별 영역 표(영역 | A | B | C), 휴대폰에서는 영역 카드로 쌓임 */
:root{
  --bg:#f6f8f6; --surface:#ffffff; --fg:#1d2a24; --muted:#5d6b64; --line:#d8e0db;
  --accent:#2f6b4f; --accent-soft:#e3efe8;
  --lvA:#2f6b4f; --lvB:#8a6d1e; --lvC:#a2483a;
  --display:"Gowun Batang","Nanum Myeongjo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a17; --surface:#1a2420; --fg:#e4ece7; --muted:#9aaba2; --line:#2c3a34;
  --accent:#7cc4a0; --accent-soft:#21362c; --lvA:#7cc4a0; --lvB:#d9b75e; --lvC:#e78b7b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131a17; --surface:#1a2420; --fg:#e4ece7; --muted:#9aaba2; --line:#2c3a34;
  --accent:#7cc4a0; --accent-soft:#21362c; --lvA:#7cc4a0; --lvB:#d9b75e; --lvC:#e78b7b; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto}
header{padding-block:28px 12px;display:grid;gap:6px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--accent);font-weight:600}
h1{font-family:var(--display);font-size:clamp(24px,4vw,32px);margin:0;text-wrap:balance;line-height:1.3}
.lede{color:var(--muted);margin:0;max-width:68ch}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
.tabs button{font:inherit;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--fg);
  padding:6px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav{display:grid;gap:8px}
.modes{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;justify-self:start}
.modes button{font:inherit;font-weight:600;font-size:13px;border:0;background:var(--surface);color:var(--muted);padding:6px 16px;cursor:pointer}
.modes button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.modes button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.subj{margin-top:26px;display:grid;gap:12px}
.subj h2{border-bottom:1px solid var(--line);padding-bottom:6px}
.sems{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.sem{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:12px 14px;min-width:0}
.sem h3{margin:0 0 8px;font-size:13px;color:var(--accent);letter-spacing:.04em}
.sem ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.sem li{display:grid;gap:3px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 6px;color:var(--muted);background:var(--bg)}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface)}
summary{cursor:pointer;padding:10px 14px;font-weight:600;font-size:14px}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details .table{border:0;border-top:1px solid var(--line);border-radius:0 0 8px 8px}
.levels{display:flex;flex-wrap:wrap;gap:8px 18px;padding-block:14px;font-size:13px;color:var(--muted)}
.levels b{font-weight:600}
.pill{display:inline-block;min-width:22px;text-align:center;font-weight:600;font-size:12px;border-radius:4px;padding:0 6px;margin-right:4px;color:var(--surface)}
.pA{background:var(--lvA)}.pB{background:var(--lvB)}.pC{background:var(--lvC)}
section.band{margin-top:22px}
h2{font-family:var(--display);font-size:20px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
h2 small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:400}
.table{border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:160px repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row>div{padding:12px 14px;min-width:0}
.row.head{background:var(--accent-soft);font-size:13px;font-weight:600}
.area{font-weight:600}
.code{display:block;font-size:12px;color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.lv{display:none}
.note{margin-top:22px;font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:12px;max-width:80ch}
@media (max-width:720px){
  .row.head{display:none}
  .row{grid-template-columns:1fr}
  .row>div{padding:8px 14px}
  .row>div.area{padding-top:14px;background:var(--accent-soft)}
  .lv{display:inline-block}
}
</style>

const tabs = document.getElementById('tabs'), main = document.getElementById('main');

document.getElementById('levels').innerHTML = Object.entries(D.general)
  .map(([k,v]) => `<span><span class="pill p${k}">${k}</span>${esc(v)}</span>`).join('');
const note = document.getElementById('note');
const SUB = Object.fromEntries(D.subjects.map(s => [s.name, s]));
const head = `<div class="row head"><div>영역</div><div><span class="pill pA">A</span>잘함</div><div><span class="pill pB">B</span>보통</div><div><span class="pill pC">C</span>노력 요함</div></div>`;
const rowHtml = r => `<div class="row"><div class="area">${esc(r[0])}${r[1]?`<span class="code">[${esc(r[1])}-○○]</span>`:''}</div>
  <div><span class="pill pA lv">A</span>${esc(r[2])}</div><div><span class="pill pB lv">B</span>${esc(r[3])}</div><div><span class="pill pC lv">C</span>${esc(r[4])}</div></div>`;
let mode = 'grade', idx = 0;
function save(){ try{ localStorage.setItem('view', JSON.stringify({mode, idx})) }catch(e){} }
function renderTabs(){
  const items = mode === 'grade' ? D.grades.map(g => g.grade + '학년') : D.subjects.map(s => s.name);
  tabs.innerHTML = '';
  items.forEach((t,i) => { const b = document.createElement('button'); b.type='button'; b.role='tab'; b.id=`tab-${mode}-${i}`; b.textContent=t;
    b.setAttribute('aria-selected', i===idx); b.onclick = () => { idx=i; render(); }; tabs.appendChild(b); });
  document.getElementById('mode-grade').setAttribute('aria-selected', mode==='grade');
  document.getElementById('mode-subj').setAttribute('aria-selected', mode==='subj');
}
function renderGrade(g){
  main.innerHTML = g.subjects.map(s => {
    const used = []; s.sems.forEach(se => se.units.forEach(u => u[1].forEach(d => { if (!used.includes(d)) used.push(d) })));
    const band = SUB[s.name].bands.find(b => b.band === g.band);
    const rows = band.rows.filter(r => used.includes(r[0]));
    return `<section class="subj"><h2>${esc(s.name)} <small>${g.grade}학년 · ${esc(g.band)} 성취수준 적용</small></h2>
      <div class="sems">${s.sems.map(se => `<div class="sem"><h3>${esc(se.sem)}</h3><ul>${se.units.map(u => `<li><span>${esc(u[0])}</span>

      <details open><summary>${g.grade}학년 ${esc(s.name)}에서 다루는 영역의 성취수준 (${rows.length}개 영역)</summary>

  }).join('');

}
function renderSubject(s){
  main.innerHTML = s.bands.map(b => `
    <section class="band"><h2>${esc(b.band)} <small>${esc(s.name)} · ${b.rows.length}개 영역</small></h2>
    <div class="table">${head}${b.rows.map(rowHtml).join('')}</div></section>`).join('');
  note.textContent = '※ ' + D.note + ' A·B·C 문구는 평가원 성취수준 일반적 특성을 영역에 적용한 정리본으로, 평가원 원문과 다를 수 있습니다.';
}
function render(){
  const list = mode === 'grade' ? D.grades : D.subjects;
  if (idx >= list.length) idx = 0;
  renderTabs();
  mode === 'grade' ? renderGrade(D.grades[idx]) : renderSubject(D.subjects[idx]);
  save();
}
document.getElementById('mode-grade').onclick = () => { mode='grade'; idx=0; render(); };
document.getElementById('mode-subj').onclick = () => { mode='subj'; idx=0; render(); };

render();
